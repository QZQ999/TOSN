seed: 2026
device: cuda
output_dir: results/runs/smoke_manuscript

data:
  kind: synthetic_multiplex
  length: 800
  channels: 6
  layers: 3
  seq_len: 48
  pred_len: 24
  train_ratio: 0.60
  val_ratio: 0.20
  batch_size: 32
  num_workers: 0
  network_complexity: 0.55
  shift_start: 0.80
  shift_severity: 0.70

backbone:
  name: dlinear
  hidden_dim: 48
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0001

ugma:
  d_model: 32
  encoder_epochs: 1
  risk_pretrain_epochs: 0
  enhancement_epochs: 2
  learning_rate: 0.0005
  weight_decay: 0.0001
  bank_size: 64
  top_k: 8
  temporal_gap: 48
  contrastive_temperature: 0.10
  retrieval_temperature: 0.10
  risk_loss_weight: 1.0
  risk_rank_weight: 0.0
  shift_augmentation_probability: 0.0
  shift_augmentation_severity: 0.0
  fallback_similarity_threshold: 0.0
  topology_strength: 0.0
  topology_mode: none
  dfm_mode: channel_independent
  use_hcb: true
  use_dfm: true
  use_risk_gate: true
  training_protocol: manuscript_joint
  risk_monitor_mode: manuscript_mlp
  normalization_mode: revin
  gate_mode: manuscript_topk
  positive_metric: euclidean
