[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugma-r1-experiments"
version = "0.1.0"
description = "Reproducible R1 experiments for U-GMA"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
  "psutil>=5.9,<7",
  "reformer-pytorch==1.4.4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ugma = "ugma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
